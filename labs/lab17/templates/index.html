<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image uploader by Jalen Banks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='uploads/imguploader_style.css') }}">
</head>
<body>
    <h1 class="title">Upload an image created by Jalen Banks</h1>

    <form id="uploadForm" action="{{ url_for('upload_image') }}" method="post" enctype="multipart/form-data">
        <input type="file" name="image" id="imageInput" required>
        <button type="submit" class="btnupload">Upload</button>
    </form>

    <p id="message">{{ message }}</p>

    <h2 class="subtitle">Gallery</h2>
    <div class="gallery" id="gallery">
        {% if images %}
            {% for image in images %}
                <div class="card">
                    <img src="{{ url_for('static', filename='uploads/' ~ image) }}" alt="{{ image }}">
                </div>
            {% endfor %}
        {% else %}
            <p>No images uploaded yet.</p>
        {% endif %}
    </div>
</body>
</html>
